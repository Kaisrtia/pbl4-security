# Legacy single-machine lab; not the two-machine LAN deployment.
name: pbl4-security

services:
  client_node:
    build:
      context: ../..
      dockerfile: deploy/local/client.Dockerfile
    container_name: client_node
    ports:
      - "3000:3000"
    cap_add:
      - NET_ADMIN
    networks:
      cyber_net:
        ipv4_address: 172.20.0.10
    environment:
      - TARGET_SERVER_URL=http://172.20.0.20:8080
      - GOD_VIEW_URL=http://172.20.0.99:4000/api/telemetry
    restart: unless-stopped

  target_server:
    build:
      context: ../..
      dockerfile: deploy/server/target.Dockerfile
    container_name: target_server
    ports:
      - "8080:8080"
      - "9000:9000"
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.tcp_syncookies=0
      - net.ipv4.tcp_max_syn_backlog=128
      - net.ipv4.ip_forward=0
    networks:
      cyber_net:
        ipv4_address: 172.20.0.20
    environment:
      - PORT=8080
      - TCP_PORT=9000
      - GOD_VIEW_URL=http://172.20.0.99:4000/api/telemetry
    restart: unless-stopped

  hacker_node:
    build:
      context: ../..
      dockerfile: deploy/attacker/Dockerfile
    container_name: hacker_node
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      cyber_net:
        ipv4_address: 172.20.0.66
    environment:
      - PORT=5000
      - TARGET_IP=172.20.0.20
      - CLIENT_IP=172.20.0.10
      - GOD_VIEW_URL=http://172.20.0.99:4000/api/telemetry
    depends_on:
      - target_server
    restart: unless-stopped

  god_view:
    build:
      context: ../..
      dockerfile: deploy/server/god-view.Dockerfile
    container_name: god_view
    ports:
      - "4000:4000"
      - "5173:5173"
    networks:
      cyber_net:
        ipv4_address: 172.20.0.99
    environment:
      - PORT=4000
      - UI_PORT=5173
    restart: unless-stopped

networks:
  cyber_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
